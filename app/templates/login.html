
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | MESC</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/estilo.css') }}"
    >
</head>

<body class="bg-light">

    <main class="container min-vh-100 d-flex align-items-center justify-content-center">

        <div class="card shadow-sm border-0 login-card">

            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">
                    <h1 class="fw-bold text-success">MESC</h1>
                    <p class="text-secondary">
                        Portal do Associado
                    </p>
                </div>

                <h2 class="h4 text-center mb-4">
                    Acesse sua conta
                </h2>


              {% if erro %}
                 <div class="alert alert-danger" role="alert">
                    {{ erro }}
                </div>
              {% endif %}


                <form method="POST" action="{{ url_for('autenticacao.login') }}">
                    <input 
                        type="hidden" 
                        name="csrf_token" 
                        value="{{ csrf_token() }}"
                    >

                    <div class="mb-3">
                        <label for="id_associado" class="form-label">
                            Identificação do associado
                        </label>

                        <input
                            type="number"
                            class="form-control form-control-lg"
                            id="id_associado"
                            name="id_associado"
                            min="1"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label for="senha" class="form-label">
                            Senha
                        </label>

                        <input
                            type="password"
                            class="form-control form-control-lg"
                            id="senha"
                            name="senha"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button
                        type="submit"
                        class="btn btn-success btn-lg w-100"
                    >
                        Entrar
                    </button>

                </form>

                <p class="text-center text-secondary small mt-4 mb-0">
                    Clube de Campo MESC
                </p>

            </div>
        </div>

    </main>

</body>
</html>
